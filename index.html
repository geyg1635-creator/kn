<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日金融时政</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "微软雅黑", Arial, sans-serif;
    background: #eef3fa;
    min-height: 100vh;
    padding: 12px;
    color: #333;
    font-size: 16px;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(26,58,107,0.1);
    padding: 18px 16px 24px;
  }
  .header { text-align: center; margin-bottom: 16px; }
  .header h1 { font-size: 22px; color: #1a3a6b; margin-bottom: 4px; }
  .header .date { font-size: 13px; color: #888; }
  .section-title {
    font-size: 15px; font-weight: bold; color: #1a3a6b;
    margin: 18px 0 10px 2px; padding-bottom: 6px;
    border-bottom: 2px solid #f0f4f8;
  }
  .news-item {
    padding: 13px 12px; border-radius: 12px;
    border: 1.5px solid #eef2f7; background: #fafcff;
    margin-bottom: 8px;
  }
  .news-item .title {
    font-size: 14px; font-weight: 600; color: #2c3e50;
    line-height: 1.5; margin-bottom: 6px;
  }
  .news-item .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .news-item .tag {
    font-size: 11px; color: #4a90d9; background: #e8f0fe;
    padding: 2px 8px; border-radius: 6px;
  }
  .news-item a { font-size: 12px; color: #4a90d9; text-decoration: none; }
  .news-item a:hover { text-decoration: underline; }
  .loading, .error { text-align: center; padding: 30px; color: #999; font-size: 14px; }
  .error { color: #c0392b; }
  .footer { text-align: center; font-size: 12px; color: #aaa; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📰 每日金融时政</h1>
    <div class="date" id="updateDate">加载中...</div>
  </div>

  <div class="section-title">🏦 今日财经要闻</div>
  <div id="newsList"><div class="loading">正在加载...</div></div>

  <div class="footer">每天早上 8:00 自动更新</div>
</div>

<script>
fetch("news.json?t=" + Date.now())
  .then(res => res.json())
  .then(data => {
    document.getElementById("updateDate").textContent = `更新于 ${data.updated}`;
    const list = document.getElementById("newsList");
    if (!data.news || data.news.length === 0) {
      list.innerHTML = '<div class="error">暂无新闻</div>';
      return;
    }
    list.innerHTML = "";
    data.news.forEach(item => {
      const div = document.createElement("div");
      div.className = "news-item";
      div.innerHTML = `
        <div class="title">${item.title}</div>
        <div class="meta">
          <span class="tag">${item.source}</span>
          ${item.url ? `<a href="${item.url}" target="_blank">🔗 原文</a>` : ""}
        </div>
      `;
      list.appendChild(div);
    });
  })
  .catch(e => {
    document.getElementById("newsList").innerHTML = '<div class="error">加载失败，请稍后刷新</div>';
  });
</script>

</body>
</html>
